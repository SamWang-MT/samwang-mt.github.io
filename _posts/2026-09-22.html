<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>信息看板 · 天气 · 留言 · 日历</title>
  <style>
    :root, [data-theme="dark"] {
      --bg: #0f1419; --card: #1a2332; --card-hover: #243044; --border: #2d3a4f;
      --text: #e7ecf3; --text-muted: #8b9cb3; --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.18); --success: #22c55e; --danger: #ef4444;
      --warning: #f59e0b; --input-bg: #0d1117; --header-bg: #151c27;
      --shadow: 0 2px 12px rgba(0,0,0,0.35);
    }
    [data-theme="light"] {
      --bg: #f0f2f5; --card: #ffffff; --card-hover: #f7f8fa; --border: #d8dee6;
      --text: #1a2332; --text-muted: #6b7a90; --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.12); --success: #16a34a; --danger: #dc2626;
      --warning: #d97706; --input-bg: #f8fafc; --header-bg: #ffffff;
      --shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    [data-theme="eye-care"] {
      --bg: #c7edcc; --card: #e3f2e5; --card-hover: #d4ebd7; --border: #a8c9ad;
      --text: #2c3e2d; --text-muted: #5a7a5c; --accent: #2d6a4f;
      --accent-soft: rgba(45, 106, 79, 0.15); --success: #40916c; --danger: #b94a48;
      --warning: #b08900; --input-bg: #f0faf1; --header-bg: #d8edd9;
      --shadow: 0 2px 10px rgba(45, 106, 79, 0.12);
    }
    [data-theme="sepia"] {
      --bg: #f4ecd8; --card: #faf6eb; --card-hover: #f0e6d0; --border: #d4c4a8;
      --text: #3d3226; --text-muted: #7a6b56; --accent: #8b5e3c;
      --accent-soft: rgba(139, 94, 60, 0.15); --success: #5a7a3a; --danger: #a3443a;
      --warning: #b8860b; --input-bg: #fdf9f0; --header-bg: #efe6d2;
      --shadow: 0 2px 10px rgba(61, 50, 38, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.4; font-size: 14px;
    }

    /* 顶栏 / 天气 / 留言60% + 日历待办40% / 底栏 */
    .app {
      height: 100vh; width: 100vw;
      display: grid;
      grid-template-rows: auto minmax(0, 22%) minmax(0, 1fr) auto;
      grid-template-columns: 6fr 4fr;
      gap: 8px; padding: 8px 10px; overflow: hidden;
    }
    .app > header { grid-column: 1 / -1; }
    .weather-panel { grid-column: 1 / -1; grid-row: 2; }
    .message-panel { grid-column: 1; grid-row: 3; }
    .side-panel { grid-column: 2; grid-row: 3; }
    .io-bar { grid-column: 1 / -1; grid-row: 4; }

    header {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--header-bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 6px 14px; box-shadow: var(--shadow); min-height: 40px;
    }
    header .title { font-size: 1.05rem; font-weight: 650; display: flex; align-items: center; gap: 10px; }
    header .clock { font-weight: 500; font-size: 0.88rem; color: var(--accent); }
    .header-actions { display: flex; align-items: center; gap: 8px; }

    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 8px 10px; box-shadow: var(--shadow);
      display: flex; flex-direction: column; min-height: 0; overflow: hidden; height: 100%;
    }
    .card h2 {
      font-size: 0.88rem; font-weight: 600; margin-bottom: 6px;
      display: flex; align-items: center; gap: 6px; flex-shrink: 0;
    }

    button, .btn {
      appearance: none; border: 1px solid var(--border); background: var(--card);
      color: var(--text); padding: 5px 11px; border-radius: 7px; font-size: 0.8rem;
      cursor: pointer; transition: background 0.15s, border-color 0.15s; white-space: nowrap;
    }
    button:hover { background: var(--card-hover); border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover { filter: brightness(1.08); }
    button.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
    button.danger:hover { background: rgba(239, 68, 68, 0.12); }
    button.small { padding: 2px 8px; font-size: 0.72rem; }

    /* 天气 */
    .weather-panel { padding: 6px 8px; }
    .weather-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
      height: 100%; min-height: 0;
    }
    .weather-item {
      background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 6px 8px; text-align: center;
      display: flex; flex-direction: column; justify-content: space-between; min-height: 0; overflow: hidden;
    }
    .weather-item .city { font-weight: 700; font-size: 0.9rem; margin-bottom: 2px; }
    .weather-item .icon-row { display: flex; align-items: center; justify-content: center; gap: 6px; }
    .weather-item .icon { font-size: 1.55rem; line-height: 1; }
    .weather-item .temp { font-size: 1.35rem; font-weight: 700; color: var(--accent); }
    .weather-item .desc { font-size: 0.72rem; color: var(--text-muted); }
    .weather-item .detail { font-size: 0.65rem; color: var(--text-muted); margin-top: 1px; }
    .weather-item .forecast {
      margin-top: 4px; padding-top: 4px; border-top: 1px dashed var(--border);
      font-size: 0.68rem; color: var(--text-muted); text-align: left; line-height: 1.4;
    }

    /* 右侧：日历 + 待办上下合并 */
    .side-panel {
      display: flex; flex-direction: column; gap: 8px; min-height: 0; overflow: hidden;
    }
    .side-panel .cal-card {
      flex: 0 0 auto; max-height: 48%;
      display: flex; flex-direction: column; min-height: 0; overflow: hidden;
    }
    .side-panel .todo-card {
      flex: 1 1 auto; min-height: 0;
      display: flex; flex-direction: column; overflow: hidden;
    }

    .cal-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 4px; flex-shrink: 0;
    }
    .cal-header .month-title { font-weight: 600; font-size: 0.85rem; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; flex-shrink: 0; }
    .cal-weekday { text-align: center; font-size: 0.65rem; color: var(--text-muted); padding: 1px 0; }
    .cal-day {
      aspect-ratio: 1; max-height: 28px; display: flex; align-items: center; justify-content: center;
      border-radius: 5px; font-size: 0.75rem; cursor: pointer; border: 1px solid transparent; position: relative;
    }
    .cal-day:hover { background: var(--card-hover); }
    .cal-day.other { color: var(--text-muted); opacity: 0.4; }
    .cal-day.today { border-color: var(--accent); font-weight: 700; }
    .cal-day.selected { background: var(--accent-soft); border-color: var(--accent); }
    .cal-day.has-note::after {
      content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--warning);
      position: absolute; bottom: 1px;
    }
    .cal-hint {
      margin-top: 4px; font-size: 0.68rem; color: var(--text-muted); text-align: center; flex-shrink: 0;
    }

    /* 留言双栏 */
    .msg-toolbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 6px; flex-shrink: 0;
    }
    .msg-columns {
      flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; overflow: hidden;
    }
    .msg-col {
      overflow: hidden; border: 1px solid var(--border); border-radius: 8px;
      background: var(--input-bg); display: flex; flex-direction: column;
    }
    .msg-col-inner {
      display: flex; flex-direction: column; gap: 6px; padding: 6px;
      flex: 1; min-height: 0; overflow: hidden;
    }
    .msg-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 7px;
      padding: 6px 8px; flex-shrink: 0;
    }
    .msg-card .meta {
      display: flex; justify-content: space-between; gap: 4px;
      font-size: 0.65rem; color: var(--text-muted); margin-bottom: 2px;
    }
    .msg-card .author { font-weight: 600; color: var(--accent); }
    .msg-card .content {
      word-break: break-word; line-height: 1.35; font-size: 0.82rem;
      max-height: 2.8em; overflow: hidden;
    }
    .msg-card .actions { display: flex; gap: 3px; margin-top: 4px; flex-wrap: wrap; }
    .msg-card .reply-count { font-size: 0.62rem; color: var(--text-muted); margin-top: 2px; }
    .msg-empty {
      color: var(--text-muted); font-size: 0.8rem; padding: 12px; text-align: center;
    }

    /* 待办 */
    .todo-toolbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 6px; flex-shrink: 0;
    }
    .todo-scroll-wrap {
      flex: 1; min-height: 0; overflow: hidden; position: relative;
      border: 1px solid var(--border); border-radius: 8px; background: var(--input-bg);
    }
    .todo-scroll-inner {
      display: flex; flex-direction: column; gap: 5px; padding: 6px; will-change: transform;
    }
    .todo-item {
      display: flex; align-items: flex-start; gap: 6px;
      background: var(--card); border: 1px solid var(--border); border-radius: 7px;
      padding: 6px 8px; flex-shrink: 0; cursor: pointer;
    }
    .todo-item.done .todo-text { text-decoration: line-through; opacity: 0.65; }
    .todo-item input[type="checkbox"] { margin-top: 2px; accent-color: var(--accent); flex-shrink: 0; }
    .todo-text { flex: 1; word-break: break-word; min-width: 0; }
    .todo-meta { font-size: 0.62rem; color: var(--text-muted); margin-top: 1px; }
    .todo-date-tag {
      font-size: 0.62rem; background: var(--accent-soft); color: var(--accent);
      padding: 0 5px; border-radius: 4px; margin-left: 4px;
    }
    .todo-item .todo-del {
      flex-shrink: 0; align-self: center;
    }

    .io-bar {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      padding: 6px; background: var(--header-bg); border: 1px solid var(--border);
      border-radius: 10px; flex-shrink: 0;
    }

    /* 弹窗 */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      display: none; align-items: center; justify-content: center; z-index: 200;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px; width: min(480px, 94vw); max-height: 85vh;
      display: flex; flex-direction: column; box-shadow: var(--shadow); overflow: hidden;
    }
    .modal h3 { font-size: 1rem; margin-bottom: 12px; flex-shrink: 0; }
    .modal .form-group { margin-bottom: 10px; }
    .modal .form-group label {
      display: block; font-size: 0.78rem; color: var(--text-muted); margin-bottom: 3px;
    }
    .modal input[type="text"], .modal textarea, .modal select {
      width: 100%; background: var(--input-bg); border: 1px solid var(--border);
      border-radius: 7px; padding: 8px 10px; color: var(--text); font-size: 0.88rem; font-family: inherit;
    }
    .modal textarea { resize: vertical; min-height: 72px; }
    .modal input:focus, .modal textarea:focus, .modal select:focus {
      outline: none; border-color: var(--accent);
    }
    .modal-actions {
      display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; flex-shrink: 0;
    }
    .style-row {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px;
    }
    .style-row label { font-size: 0.75rem; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
    .style-row select, .style-row input[type="color"] {
      background: var(--input-bg); border: 1px solid var(--border); border-radius: 5px;
      color: var(--text); font-size: 0.75rem; height: 28px; padding: 2px 4px;
    }
    .style-row input[type="color"] { width: 36px; padding: 1px; cursor: pointer; }
    .emoji-bar { display: flex; flex-wrap: wrap; gap: 2px; margin-bottom: 8px; max-height: 72px; overflow-y: auto; }
    .emoji-bar button {
      padding: 2px 5px; font-size: 1.05rem; line-height: 1.2; border: none; background: transparent;
    }
    .emoji-bar button:hover { background: var(--accent-soft); border-radius: 4px; }
    .modal .replies-block {
      margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px;
      max-height: 140px; overflow-y: auto; font-size: 0.82rem;
    }
    .modal .reply-item {
      background: var(--input-bg); border-radius: 6px; padding: 6px 8px; margin-bottom: 5px;
    }

    .settings-dropdown { position: relative; }
    .settings-menu {
      display: none; position: absolute; right: 0; top: 100%; margin-top: 4px;
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 8px; min-width: 150px; box-shadow: var(--shadow); z-index: 50;
    }
    .settings-menu.show { display: block; }
    .settings-menu label {
      display: flex; align-items: center; gap: 6px; padding: 4px 6px;
      cursor: pointer; border-radius: 5px; font-size: 0.82rem;
    }
    .settings-menu label:hover { background: var(--card-hover); }

    .toast {
      position: fixed; bottom: 20px; right: 20px; background: var(--card);
      border: 1px solid var(--border); padding: 10px 16px; border-radius: 8px;
      box-shadow: var(--shadow); font-size: 0.85rem; z-index: 300;
      opacity: 0; transform: translateY(10px); transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { border-color: var(--success); }
    .toast.error { border-color: var(--danger); }

    @media (max-width: 900px) {
      html, body { overflow: auto; height: auto; }
      .app {
        height: auto; min-height: 100vh; grid-template-columns: 1fr;
        grid-template-rows: auto auto auto auto auto;
      }
      .weather-panel { grid-column: 1; grid-row: 2; min-height: 180px; }
      .message-panel { grid-column: 1; grid-row: 3; min-height: 300px; }
      .side-panel { grid-column: 1; grid-row: 4; min-height: 360px; }
      .io-bar { grid-column: 1; grid-row: 5; }
      .weather-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title">信息看板 <span class="clock" id="clock"></span></div>
      <div class="header-actions">
        <button type="button" id="btn-refresh-weather" class="small">刷新天气</button>
        <div class="settings-dropdown">
          <button type="button" id="btn-settings" class="small">页面设置 ▾</button>
          <div class="settings-menu" id="settings-menu">
            <label><input type="radio" name="theme" value="dark" checked /> 深色</label>
            <label><input type="radio" name="theme" value="light" /> 浅色</label>
            <label><input type="radio" name="theme" value="eye-care" /> 护眼绿</label>
            <label><input type="radio" name="theme" value="sepia" /> 羊皮纸</label>
          </div>
        </div>
      </div>
    </header>

    <section class="card weather-panel">
      <div class="weather-grid" id="weather-grid"></div>
    </section>

    <!-- 留言 60% -->
    <section class="card message-panel">
      <div class="msg-toolbar">
        <h2 style="margin:0;">留言板</h2>
        <button type="button" class="primary small" id="btn-open-post">发布留言</button>
      </div>
      <div class="msg-columns" id="msg-columns">
        <div class="msg-col"><div class="msg-col-inner" id="msg-inner-left"></div></div>
        <div class="msg-col"><div class="msg-col-inner" id="msg-inner-right"></div></div>
      </div>
    </section>

    <!-- 日历 + 待办 40%，上下合并 -->
    <div class="side-panel">
      <section class="card cal-card">
        <h2>日历</h2>
        <div class="cal-header">
          <button type="button" class="small" id="cal-prev">‹</button>
          <span class="month-title" id="cal-month-title"></span>
          <button type="button" class="small" id="cal-next">›</button>
        </div>
        <div class="cal-grid" id="cal-weekdays"></div>
        <div class="cal-grid" id="cal-days"></div>
        <p class="cal-hint">点击日期 → 添加待办</p>
      </section>

      <section class="card todo-card">
        <div class="todo-toolbar">
          <h2 style="margin:0;">待办与提醒</h2>
          <button type="button" class="primary small" id="btn-open-todo">添加待办</button>
        </div>
        <div class="todo-scroll-wrap" id="todo-scroll-wrap">
          <div class="todo-scroll-inner" id="todo-scroll-inner"></div>
        </div>
      </section>
    </div>

    <div class="io-bar">
      <button type="button" class="primary" id="btn-export">导出数据 (JSON)</button>
      <button type="button" id="btn-import-open">导入数据</button>
      <button type="button" class="danger" id="btn-clear-all">清空本地数据</button>
    </div>
  </div>

  <!-- 弹窗：发布/修改留言 -->
  <div class="modal-overlay" id="modal-msg">
    <div class="modal">
      <h3 id="modal-msg-title">发布留言</h3>
      <div class="form-group">
        <label>昵称 <span style="color:var(--danger)">*</span></label>
        <input type="text" id="modal-msg-author" maxlength="20" placeholder="必填，默认地球人" />
      </div>
      <div class="style-row">
        <label>字体
          <select id="modal-msg-font">
            <option value="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">默认</option>
            <option value="'Microsoft YaHei', sans-serif">雅黑</option>
            <option value="'SimSun', serif">宋体</option>
            <option value="'KaiTi', serif">楷体</option>
            <option value="'Courier New', monospace">等宽</option>
            <option value="Georgia, serif">衬线</option>
          </select>
        </label>
        <label>大小
          <select id="modal-msg-size">
            <option value="12px">小</option>
            <option value="14px" selected>中</option>
            <option value="16px">大</option>
            <option value="18px">较大</option>
          </select>
        </label>
        <label>颜色 <input type="color" id="modal-msg-color" value="#e7ecf3" /></label>
      </div>
      <div class="emoji-bar" id="modal-msg-emoji"></div>
      <div class="form-group">
        <label>内容（建议不超过 20 字）</label>
        <textarea id="modal-msg-content" maxlength="100" rows="3" placeholder="写点什么…"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" data-close="modal-msg">取消</button>
        <button type="button" class="primary" id="modal-msg-save">发布</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-reply">
    <div class="modal">
      <h3>跟帖</h3>
      <p id="modal-reply-origin" style="font-size:0.82rem;color:var(--text-muted);margin-bottom:10px;"></p>
      <div class="form-group">
        <label>昵称 <span style="color:var(--danger)">*</span></label>
        <input type="text" id="modal-reply-author" maxlength="20" />
      </div>
      <div class="emoji-bar" id="modal-reply-emoji"></div>
      <div class="form-group">
        <label>跟帖内容</label>
        <textarea id="modal-reply-content" maxlength="100" rows="3"></textarea>
      </div>
      <div id="modal-reply-list" class="replies-block"></div>
      <div class="modal-actions">
        <button type="button" data-close="modal-reply">取消</button>
        <button type="button" class="primary" id="modal-reply-save">发送跟帖</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-todo">
    <div class="modal">
      <h3 id="modal-todo-title">添加待办</h3>
      <div class="form-group">
        <label>关联日期</label>
        <input type="text" id="modal-todo-date" readonly style="opacity:0.85;" />
      </div>
      <div class="form-group">
        <label>标题 <span style="color:var(--danger)">*</span></label>
        <input type="text" id="modal-todo-title-input" maxlength="40" placeholder="待办标题" />
      </div>
      <div class="style-row">
        <label>大小
          <select id="modal-todo-size">
            <option value="12px">小</option>
            <option value="14px" selected>中</option>
            <option value="16px">大</option>
            <option value="18px">较大</option>
          </select>
        </label>
        <label>颜色 <input type="color" id="modal-todo-color" value="#e7ecf3" /></label>
      </div>
      <div class="emoji-bar" id="modal-todo-emoji"></div>
      <div class="form-group">
        <label>备注</label>
        <textarea id="modal-todo-note" maxlength="200" rows="2" placeholder="可选备注"></textarea>
      </div>
      <div class="form-group" id="modal-todo-done-row" style="display:none;">
        <label><input type="checkbox" id="modal-todo-done" /> 已完成</label>
      </div>
      <div class="modal-actions">
        <button type="button" class="danger" id="modal-todo-delete" style="display:none;margin-right:auto;">删除</button>
        <button type="button" data-close="modal-todo">取消</button>
        <button type="button" class="primary" id="modal-todo-save">保存</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="import-modal">
    <div class="modal">
      <h3>导入 JSON 数据</h3>
      <p style="font-size:0.8rem;color:var(--text-muted);margin-bottom:8px;">粘贴导出的 JSON，将覆盖当前留言与待办。</p>
      <textarea id="import-json" style="min-height:160px;font-family:ui-monospace,monospace;font-size:0.78rem;" placeholder='{"messages":[],"todos":[]}'></textarea>
      <div class="modal-actions">
        <button type="button" data-close="import-modal">取消</button>
        <button type="button" class="primary" id="btn-import-confirm">确认导入</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const CITIES = [
      { name: "Burnaby", lat: 49.2488, lon: -122.9805 },
      { name: "Montreal", lat: 45.5017, lon: -73.5673 },
      { name: "上海", lat: 31.2304, lon: 121.4737 },
      { name: "连云港", lat: 34.5969, lon: 119.2215 }
    ];
    const WEATHER_REFRESH_MS = 15 * 60 * 1000;
    const STORAGE_KEY = "info_dashboard_data_v3";
    const THEME_KEY = "info_dashboard_theme";
    const NICK_KEY = "info_dashboard_nick";
    const DEFAULT_NICK = "地球人";
    const MSG_SCROLL_INTERVAL_MS = 2800; // 接续滚动间隔

    const WMO_MAP = {
      0: { text: "晴", icon: "☀️" }, 1: { text: "大部晴朗", icon: "🌤️" },
      2: { text: "局部多云", icon: "⛅" }, 3: { text: "阴", icon: "☁️" },
      45: { text: "雾", icon: "🌫️" }, 48: { text: "雾凇", icon: "🌫️" },
      51: { text: "小毛毛雨", icon: "🌦️" }, 53: { text: "毛毛雨", icon: "🌦️" },
      55: { text: "大毛毛雨", icon: "🌧️" }, 61: { text: "小雨", icon: "🌧️" },
      63: { text: "中雨", icon: "🌧️" }, 65: { text: "大雨", icon: "🌧️" },
      66: { text: "冻雨", icon: "🌨️" }, 71: { text: "小雪", icon: "🌨️" },
      73: { text: "中雪", icon: "❄️" }, 75: { text: "大雪", icon: "❄️" },
      80: { text: "小阵雨", icon: "🌦️" }, 81: { text: "阵雨", icon: "🌦️" },
      82: { text: "强阵雨", icon: "⛈️" }, 85: { text: "小阵雪", icon: "🌨️" },
      86: { text: "强阵雪", icon: "❄️" }, 95: { text: "雷阵雨", icon: "⛈️" },
      96: { text: "雷阵雨伴冰雹", icon: "⛈️" }, 99: { text: "强雷阵雨伴冰雹", icon: "⛈️" }
    };
    const EMOJIS = [
      "😀","😂","🥰","😎","🤔","😢","😡","👍","👏","🙏",
      "❤️","🔥","⭐","🎉","✅","❌","📌","💡","🌈","☕",
      "🌸","🐱","🐶","🍀","🎵","📷","🚀","💪","🤝","🌟",
      "⏰","📝","✨","🎁","🏆","💼","🏠","✈️"
    ];

    let state = {
      messages: [],
      todos: [],
      calYear: new Date().getFullYear(),
      calMonth: new Date().getMonth(),
      selectedDate: null
    };

    // 留言接续滚动
    const msgScroll = {
      offset: 0,
      perCol: 7,
      paused: false,
      timer: null,
      sorted: []
    };

    const todoScroll = { offset: 0, paused: false, raf: null };

    let editingMsgId = null;
    let replyMsgId = null;
    let editingTodoId = null;

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }
    function formatTime(ts) {
      return new Date(ts).toLocaleString("zh-CN", {
        month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit"
      });
    }
    function pad(n) { return String(n).padStart(2, "0"); }
    function dateKey(y, m, d) { return `${y}-${pad(m + 1)}-${pad(d)}`; }
    function todayKey() {
      const t = new Date();
      return dateKey(t.getFullYear(), t.getMonth(), t.getDate());
    }
    function escapeHtml(str) {
      if (!str) return "";
      return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
    function showToast(msg, type = "success") {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.className = "toast show " + type;
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => el.classList.remove("show"), 2600);
    }
    function openModal(id) { document.getElementById(id).classList.add("show"); }
    function closeModal(id) { document.getElementById(id).classList.remove("show"); }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          messages: state.messages, todos: state.todos
        }));
      } catch (e) {}
    }
    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (Array.isArray(data.messages)) state.messages = data.messages;
        if (Array.isArray(data.todos)) state.todos = data.todos;
      } catch (e) {}
    }
    function getNick() {
      try { return localStorage.getItem(NICK_KEY) || DEFAULT_NICK; } catch (e) { return DEFAULT_NICK; }
    }
    function setNick(n) {
      try { localStorage.setItem(NICK_KEY, n); } catch (e) {}
    }

    function applyTheme(name) {
      document.documentElement.setAttribute("data-theme", name);
      try { localStorage.setItem(THEME_KEY, name); } catch (e) {}
      const map = { dark: "#e7ecf3", light: "#1a2332", "eye-care": "#2c3e2d", sepia: "#3d3226" };
      const c = map[name] || "#e7ecf3";
      ["modal-msg-color", "modal-todo-color"].forEach((id) => {
        const el = document.getElementById(id);
        if (el && !el.dataset.userSet) el.value = c;
      });
    }
    function loadTheme() {
      let t = "dark";
      try { t = localStorage.getItem(THEME_KEY) || "dark"; } catch (e) {}
      applyTheme(t);
      const radio = document.querySelector(`input[name="theme"][value="${t}"]`);
      if (radio) radio.checked = true;
    }

    function updateClock() {
      document.getElementById("clock").textContent = new Date().toLocaleString("zh-CN", {
        weekday: "short", year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", second: "2-digit"
      });
    }

    // ===== 天气 =====
    function wmoInfo(code) {
      return WMO_MAP[code] || { text: `代码 ${code}`, icon: "🌡️" };
    }
    async function fetchCityWeather(city) {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}` +
        `&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m` +
        `&daily=weather_code,temperature_2m_max,temperature_2m_min` +
        `&timezone=auto&forecast_days=3`;
      const res = await fetch(url);
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }
    async function loadWeather() {
      const grid = document.getElementById("weather-grid");
      grid.innerHTML = "";
      try {
        const results = await Promise.all(
          CITIES.map(async (city) => ({ city, data: await fetchCityWeather(city) }))
        );
        results.forEach(({ city, data }) => {
          const cur = data.current || {};
          const daily = data.daily || {};
          const info = wmoInfo(cur.weather_code);
          let forecastHtml = "";
          if (daily.time?.length) {
            forecastHtml = daily.time.slice(0, 3).map((t, i) => {
              const label = i === 0 ? "今天" : i === 1 ? "明天" : "后天";
              const max = daily.temperature_2m_max?.[i];
              const min = daily.temperature_2m_min?.[i];
              const wi = wmoInfo(daily.weather_code?.[i]);
              return `${label} ${wi.icon} ${wi.text} ${min != null ? Math.round(min) : "-"}~${max != null ? Math.round(max) : "-"}°`;
            }).join("<br>");
          }
          const div = document.createElement("div");
          div.className = "weather-item";
          div.innerHTML = `
            <div>
              <div class="city">${escapeHtml(city.name)}</div>
              <div class="icon-row">
                <span class="icon">${info.icon}</span>
                <span class="temp">${cur.temperature_2m != null ? Math.round(cur.temperature_2m) + "°" : "--"}</span>
              </div>
              <div class="desc">${info.text}</div>
              <div class="detail">湿度 ${cur.relative_humidity_2m ?? "--"}% · 风 ${cur.wind_speed_10m != null ? Math.round(cur.wind_speed_10m) : "--"} km/h</div>
            </div>
            <div class="forecast">${forecastHtml}</div>
          `;
          grid.appendChild(div);
        });
      } catch (err) {
        grid.innerHTML = `<div style="grid-column:1/-1;color:var(--text-muted);padding:12px;">天气获取失败：${escapeHtml(err.message || String(err))}</div>`;
      }
    }

    // ===== 留言：双栏接续滚动 =====
    // 左栏显示 sorted[offset .. offset+perCol)
    // 右栏显示 sorted[offset+perCol .. offset+2*perCol)
    // 每间隔 offset++，循环

    function estimatePerCol() {
      const col = document.querySelector(".msg-col");
      if (!col) return 7;
      const h = col.clientHeight || 300;
      // 单条约 72px（含间距）
      const n = Math.max(3, Math.floor(h / 72));
      return n;
    }

    function buildMsgCard(msg) {
      const style = msg.style || {};
      const styleAttr = [
        style.fontFamily ? `font-family:${style.fontFamily}` : "",
        style.fontSize ? `font-size:${style.fontSize}` : "",
        style.color ? `color:${style.color}` : ""
      ].filter(Boolean).join(";");
      const rc = (msg.replies || []).length;
      const card = document.createElement("div");
      card.className = "msg-card";
      card.dataset.id = msg.id;
      card.innerHTML = `
        <div class="meta">
          <span class="author">${escapeHtml(msg.author || DEFAULT_NICK)}</span>
          <span>${formatTime(msg.createdAt)}</span>
        </div>
        <div class="content" style="${styleAttr}">${escapeHtml(msg.content)}</div>
        ${rc ? `<div class="reply-count">${rc} 条跟帖</div>` : ""}
        <div class="actions">
          <button type="button" class="small" data-action="reply">跟帖</button>
          <button type="button" class="small" data-action="edit">修改</button>
          <button type="button" class="small danger" data-action="delete">删除</button>
        </div>
      `;
      return card;
    }

    function getWindowSlice(arr, start, count) {
      const n = arr.length;
      if (!n) return [];
      const out = [];
      for (let i = 0; i < count; i++) {
        out.push(arr[(start + i) % n]);
      }
      return out;
    }

    function paintMsgWindow() {
      const left = document.getElementById("msg-inner-left");
      const right = document.getElementById("msg-inner-right");
      left.innerHTML = "";
      right.innerHTML = "";

      const sorted = msgScroll.sorted;
      if (!sorted.length) {
        left.innerHTML = '<div class="msg-empty">暂无留言</div>';
        return;
      }

      const per = msgScroll.perCol;
      const needScroll = sorted.length > per * 2;

      let leftSlice, rightSlice;
      if (!needScroll) {
        // 未满两栏：左放前半，右放后半，不滚动
        const mid = Math.ceil(sorted.length / 2);
        leftSlice = sorted.slice(0, mid);
        rightSlice = sorted.slice(mid);
      } else {
        // 接续窗口
        leftSlice = getWindowSlice(sorted, msgScroll.offset, per);
        rightSlice = getWindowSlice(sorted, msgScroll.offset + per, per);
      }

      leftSlice.forEach((m) => left.appendChild(buildMsgCard(m)));
      rightSlice.forEach((m) => right.appendChild(buildMsgCard(m)));
    }

    function stopMsgScroll() {
      if (msgScroll.timer) {
        clearInterval(msgScroll.timer);
        msgScroll.timer = null;
      }
    }

    function startMsgScroll() {
      stopMsgScroll();
      msgScroll.perCol = estimatePerCol();
      msgScroll.sorted = [...state.messages].sort((a, b) => b.createdAt - a.createdAt);
      msgScroll.offset = 0;
      paintMsgWindow();

      const needScroll = msgScroll.sorted.length > msgScroll.perCol * 2;
      if (!needScroll) return;

      msgScroll.timer = setInterval(() => {
        if (msgScroll.paused) return;
        const n = msgScroll.sorted.length;
        if (!n) return;
        msgScroll.offset = (msgScroll.offset + 1) % n;
        paintMsgWindow();
      }, MSG_SCROLL_INTERVAL_MS);
    }

    function renderMessages() {
      startMsgScroll();
    }

    // ===== 待办 =====
    function renderTodos() {
      const inner = document.getElementById("todo-scroll-inner");
      const sorted = [...state.todos].sort((a, b) => {
        if (a.done !== b.done) return a.done ? 1 : -1;
        return b.createdAt - a.createdAt;
      });

      if (!sorted.length) {
        inner.innerHTML = '<p style="color:var(--text-muted);font-size:0.8rem;padding:8px;">暂无待办，点击日历日期或「添加待办」</p>';
        stopTodoScroll();
        return;
      }

      inner.innerHTML = sorted.map((t) => {
        const style = t.style || {};
        const styleAttr = [
          style.fontSize ? `font-size:${style.fontSize}` : "",
          style.color ? `color:${style.color}` : ""
        ].filter(Boolean).join(";");
        return `
          <div class="todo-item ${t.done ? "done" : ""}" data-id="${t.id}">
            <input type="checkbox" ${t.done ? "checked" : ""} data-action="toggle" />
            <div style="flex:1;min-width:0;">
              <div class="todo-text" style="${styleAttr}">${escapeHtml(t.title)}</div>
              ${t.note ? `<div class="todo-meta">${escapeHtml(t.note)}</div>` : ""}
              <div class="todo-meta">
                ${formatTime(t.createdAt)}
                ${t.date ? `<span class="todo-date-tag">${escapeHtml(t.date)}</span>` : ""}
              </div>
            </div>
            <button type="button" class="small danger todo-del" data-action="del" title="删除">删</button>
          </div>
        `;
      }).join("");

      if (sorted.length >= 5) {
        inner.innerHTML = inner.innerHTML + inner.innerHTML;
      }
      startTodoScroll();
    }

    function stopTodoScroll() {
      if (todoScroll.raf) cancelAnimationFrame(todoScroll.raf);
      todoScroll.raf = null;
      todoScroll.offset = 0;
      const inner = document.getElementById("todo-scroll-inner");
      if (inner) inner.style.transform = "";
    }

    function startTodoScroll() {
      stopTodoScroll();
      const wrap = document.getElementById("todo-scroll-wrap");
      const inner = document.getElementById("todo-scroll-inner");
      todoScroll.offset = 0;
      todoScroll.paused = false;
      const speed = 0.3;
      function tick() {
        if (!todoScroll.paused) {
          const half = inner.scrollHeight / 2;
          if (half > wrap.clientHeight + 4) {
            todoScroll.offset += speed;
            if (todoScroll.offset >= half) todoScroll.offset = 0;
            inner.style.transform = `translateY(-${todoScroll.offset}px)`;
          } else {
            todoScroll.offset = 0;
            inner.style.transform = "";
          }
        }
        todoScroll.raf = requestAnimationFrame(tick);
      }
      todoScroll.raf = requestAnimationFrame(tick);
      wrap.onmouseenter = () => { todoScroll.paused = true; };
      wrap.onmouseleave = () => { todoScroll.paused = false; };
    }

    // ===== 日历 =====
    function renderCalendar() {
      document.getElementById("cal-month-title").textContent =
        `${state.calYear} 年 ${state.calMonth + 1} 月`;
      const weekdays = document.getElementById("cal-weekdays");
      if (!weekdays.children.length) {
        ["日","一","二","三","四","五","六"].forEach((w) => {
          const d = document.createElement("div");
          d.className = "cal-weekday";
          d.textContent = w;
          weekdays.appendChild(d);
        });
      }
      const daysEl = document.getElementById("cal-days");
      daysEl.innerHTML = "";
      const first = new Date(state.calYear, state.calMonth, 1);
      const startDow = first.getDay();
      const daysInMonth = new Date(state.calYear, state.calMonth + 1, 0).getDate();
      const prevDays = new Date(state.calYear, state.calMonth, 0).getDate();
      const today = todayKey();
      const todoDates = new Set(state.todos.filter((t) => t.date && !t.done).map((t) => t.date));

      for (let i = startDow - 1; i >= 0; i--) {
        const day = prevDays - i;
        const y = state.calMonth === 0 ? state.calYear - 1 : state.calYear;
        const m = state.calMonth === 0 ? 11 : state.calMonth - 1;
        const key = dateKey(y, m, day);
        daysEl.appendChild(makeDayCell(day, key, true, key === today, todoDates.has(key)));
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const key = dateKey(state.calYear, state.calMonth, d);
        daysEl.appendChild(makeDayCell(d, key, false, key === today, todoDates.has(key)));
      }
      const total = startDow + daysInMonth;
      const remain = total % 7 === 0 ? 0 : 7 - (total % 7);
      for (let d = 1; d <= remain; d++) {
        const y = state.calMonth === 11 ? state.calYear + 1 : state.calYear;
        const m = state.calMonth === 11 ? 0 : state.calMonth + 1;
        const key = dateKey(y, m, d);
        daysEl.appendChild(makeDayCell(d, key, true, false, todoDates.has(key)));
      }
    }

    function makeDayCell(dayNum, key, other, isToday, hasTodo) {
      const div = document.createElement("div");
      div.className = "cal-day";
      if (other) div.classList.add("other");
      if (isToday) div.classList.add("today");
      if (state.selectedDate === key) div.classList.add("selected");
      if (hasTodo) div.classList.add("has-note");
      div.textContent = dayNum;
      div.dataset.date = key;
      div.title = "点击添加待办：" + key;
      div.addEventListener("click", () => {
        state.selectedDate = key;
        renderCalendar();
        openTodoModal(null, key);
      });
      return div;
    }

    // ===== 留言 CRUD =====
    function openPostModal(msgId) {
      editingMsgId = msgId || null;
      const title = document.getElementById("modal-msg-title");
      const author = document.getElementById("modal-msg-author");
      const content = document.getElementById("modal-msg-content");
      const font = document.getElementById("modal-msg-font");
      const size = document.getElementById("modal-msg-size");
      const color = document.getElementById("modal-msg-color");
      const saveBtn = document.getElementById("modal-msg-save");
      if (msgId) {
        const msg = state.messages.find((m) => m.id === msgId);
        if (!msg) return;
        title.textContent = "修改留言";
        author.value = msg.author || DEFAULT_NICK;
        content.value = msg.content || "";
        if (msg.style?.fontFamily) font.value = msg.style.fontFamily;
        if (msg.style?.fontSize) size.value = msg.style.fontSize;
        if (msg.style?.color) { color.value = msg.style.color; color.dataset.userSet = "1"; }
        saveBtn.textContent = "保存修改";
      } else {
        title.textContent = "发布留言";
        author.value = getNick();
        content.value = "";
        saveBtn.textContent = "发布";
      }
      openModal("modal-msg");
      setTimeout(() => content.focus(), 50);
    }

    function saveMessage() {
      const author = document.getElementById("modal-msg-author").value.trim();
      const content = document.getElementById("modal-msg-content").value.trim();
      if (!author) { showToast("请填写昵称", "error"); return; }
      if (!content) { showToast("请填写留言内容", "error"); return; }
      setNick(author);
      const style = {
        fontFamily: document.getElementById("modal-msg-font").value,
        fontSize: document.getElementById("modal-msg-size").value,
        color: document.getElementById("modal-msg-color").value
      };
      if (editingMsgId) {
        const msg = state.messages.find((m) => m.id === editingMsgId);
        if (msg) {
          msg.author = author; msg.content = content; msg.style = style;
          msg.updatedAt = Date.now();
        }
        showToast("留言已修改");
      } else {
        state.messages.push({
          id: uid(), author, content, style, createdAt: Date.now(), replies: []
        });
        showToast("留言已发布");
      }
      saveState();
      renderMessages();
      closeModal("modal-msg");
    }

    function openReplyModal(msgId) {
      replyMsgId = msgId;
      const msg = state.messages.find((m) => m.id === msgId);
      if (!msg) return;
      document.getElementById("modal-reply-origin").textContent =
        `原留言 · ${msg.author}：${msg.content}`;
      document.getElementById("modal-reply-author").value = getNick();
      document.getElementById("modal-reply-content").value = "";
      const list = document.getElementById("modal-reply-list");
      const replies = msg.replies || [];
      list.innerHTML = replies.length
        ? replies.map((r) => `
            <div class="reply-item">
              <strong style="color:var(--accent)">${escapeHtml(r.author)}</strong>
              <span style="color:var(--text-muted);font-size:0.7rem;"> ${formatTime(r.createdAt)}</span>
              <div>${escapeHtml(r.content)}</div>
            </div>
          `).join("")
        : '<span style="color:var(--text-muted);font-size:0.8rem;">暂无跟帖</span>';
      openModal("modal-reply");
    }

    function saveReply() {
      const author = document.getElementById("modal-reply-author").value.trim();
      const content = document.getElementById("modal-reply-content").value.trim();
      if (!author) { showToast("请填写昵称", "error"); return; }
      if (!content) { showToast("请填写跟帖内容", "error"); return; }
      setNick(author);
      const msg = state.messages.find((m) => m.id === replyMsgId);
      if (!msg) return;
      if (!msg.replies) msg.replies = [];
      msg.replies.push({ id: uid(), author, content, createdAt: Date.now() });
      saveState();
      renderMessages();
      closeModal("modal-reply");
      showToast("跟帖已发送");
    }

    function deleteMessage(id) {
      if (!confirm("确定删除这条留言及其跟帖？")) return;
      state.messages = state.messages.filter((m) => m.id !== id);
      saveState();
      renderMessages();
      showToast("留言已删除");
    }

    // ===== 待办 CRUD =====
    function openTodoModal(todoId, dateStr) {
      editingTodoId = todoId || null;
      const titleEl = document.getElementById("modal-todo-title");
      const dateInput = document.getElementById("modal-todo-date");
      const titleInput = document.getElementById("modal-todo-title-input");
      const noteInput = document.getElementById("modal-todo-note");
      const size = document.getElementById("modal-todo-size");
      const color = document.getElementById("modal-todo-color");
      const doneRow = document.getElementById("modal-todo-done-row");
      const doneCb = document.getElementById("modal-todo-done");
      const delBtn = document.getElementById("modal-todo-delete");

      if (todoId) {
        const t = state.todos.find((x) => x.id === todoId);
        if (!t) return;
        titleEl.textContent = "编辑待办";
        dateInput.value = t.date || "";
        titleInput.value = t.title || "";
        noteInput.value = t.note || "";
        if (t.style?.fontSize) size.value = t.style.fontSize;
        if (t.style?.color) { color.value = t.style.color; color.dataset.userSet = "1"; }
        doneRow.style.display = "block";
        doneCb.checked = !!t.done;
        delBtn.style.display = "inline-block";
      } else {
        titleEl.textContent = "添加待办";
        dateInput.value = dateStr || state.selectedDate || todayKey();
        titleInput.value = "";
        noteInput.value = "";
        size.value = "14px";
        doneRow.style.display = "none";
        delBtn.style.display = "none";
      }
      openModal("modal-todo");
      setTimeout(() => titleInput.focus(), 50);
    }

    function saveTodo() {
      const title = document.getElementById("modal-todo-title-input").value.trim();
      if (!title) { showToast("请填写标题", "error"); return; }
      const date = document.getElementById("modal-todo-date").value.trim();
      const note = document.getElementById("modal-todo-note").value.trim();
      const style = {
        fontSize: document.getElementById("modal-todo-size").value,
        color: document.getElementById("modal-todo-color").value
      };
      if (editingTodoId) {
        const t = state.todos.find((x) => x.id === editingTodoId);
        if (t) {
          t.title = title; t.note = note; t.date = date; t.style = style;
          t.done = document.getElementById("modal-todo-done").checked;
          t.updatedAt = Date.now();
        }
        showToast("待办已更新");
      } else {
        state.todos.push({
          id: uid(), title, note, date, style, done: false, createdAt: Date.now()
        });
        showToast("待办已添加");
      }
      saveState();
      renderTodos();
      renderCalendar();
      closeModal("modal-todo");
    }

    function deleteTodoFromModal() {
      if (!editingTodoId) return;
      if (!confirm("确定删除此待办？")) return;
      state.todos = state.todos.filter((x) => x.id !== editingTodoId);
      saveState();
      renderTodos();
      renderCalendar();
      closeModal("modal-todo");
      showToast("待办已删除");
    }

    function deleteTodoById(id) {
      if (!confirm("确定删除此待办？")) return;
      state.todos = state.todos.filter((x) => x.id !== id);
      saveState();
      renderTodos();
      renderCalendar();
      showToast("待办已删除");
    }

    function toggleTodo(id) {
      const t = state.todos.find((x) => x.id === id);
      if (!t) return;
      t.done = !t.done;
      saveState();
      renderTodos();
      renderCalendar();
    }

    function downloadJson() {
      const data = {
        version: 3, exportedAt: new Date().toISOString(),
        messages: state.messages, todos: state.todos
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `info-dashboard-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast("JSON 已下载");
    }

    function importJson(text) {
      try {
        const data = JSON.parse(text);
        if (!data || typeof data !== "object") throw new Error("根节点必须是对象");
        if (data.messages && !Array.isArray(data.messages)) throw new Error("messages 应为数组");
        if (data.todos && !Array.isArray(data.todos)) throw new Error("todos 应为数组");
        if (Array.isArray(data.messages)) state.messages = data.messages;
        if (Array.isArray(data.todos)) state.todos = data.todos;
        saveState();
        renderMessages();
        renderTodos();
        renderCalendar();
        showToast("数据已导入");
        return true;
      } catch (e) {
        showToast("导入失败：" + (e.message || e), "error");
        return false;
      }
    }

    function clearAllData() {
      if (!confirm("确定清空全部留言和待办？")) return;
      state.messages = [];
      state.todos = [];
      saveState();
      renderMessages();
      renderTodos();
      renderCalendar();
      showToast("本地数据已清空");
    }

    function fillEmojiBar(containerId, targetInputId) {
      const bar = document.getElementById(containerId);
      bar.innerHTML = "";
      EMOJIS.forEach((em) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = em;
        b.addEventListener("click", () => {
          const ta = document.getElementById(targetInputId);
          const start = ta.selectionStart ?? ta.value.length;
          const end = ta.selectionEnd ?? ta.value.length;
          ta.value = ta.value.slice(0, start) + em + ta.value.slice(end);
          ta.focus();
          ta.selectionStart = ta.selectionEnd = start + em.length;
        });
        bar.appendChild(b);
      });
    }

    function bindEvents() {
      document.getElementById("btn-refresh-weather").addEventListener("click", loadWeather);

      document.getElementById("btn-settings").addEventListener("click", (e) => {
        e.stopPropagation();
        document.getElementById("settings-menu").classList.toggle("show");
      });
      document.addEventListener("click", () => {
        document.getElementById("settings-menu").classList.remove("show");
      });
      document.getElementById("settings-menu").addEventListener("click", (e) => e.stopPropagation());
      document.querySelectorAll('input[name="theme"]').forEach((r) => {
        r.addEventListener("change", () => applyTheme(r.value));
      });

      document.querySelectorAll("[data-close]").forEach((btn) => {
        btn.addEventListener("click", () => closeModal(btn.dataset.close));
      });
      document.querySelectorAll(".modal-overlay").forEach((ov) => {
        ov.addEventListener("click", (e) => {
          if (e.target === ov) ov.classList.remove("show");
        });
      });

      // 留言悬停暂停接续滚动
      const msgCols = document.getElementById("msg-columns");
      msgCols.addEventListener("mouseenter", () => { msgScroll.paused = true; });
      msgCols.addEventListener("mouseleave", () => { msgScroll.paused = false; });

      document.getElementById("btn-open-post").addEventListener("click", () => openPostModal(null));
      document.getElementById("modal-msg-save").addEventListener("click", saveMessage);
      document.getElementById("modal-msg-color").addEventListener("input", function () {
        this.dataset.userSet = "1";
      });

      msgCols.addEventListener("click", (e) => {
        const btn = e.target.closest("button");
        if (!btn) return;
        const card = e.target.closest(".msg-card");
        if (!card) return;
        const id = card.dataset.id;
        const action = btn.dataset.action;
        if (action === "delete") deleteMessage(id);
        else if (action === "edit") openPostModal(id);
        else if (action === "reply") openReplyModal(id);
      });

      document.getElementById("modal-reply-save").addEventListener("click", saveReply);

      document.getElementById("cal-prev").addEventListener("click", () => {
        if (state.calMonth === 0) { state.calMonth = 11; state.calYear--; }
        else state.calMonth--;
        renderCalendar();
      });
      document.getElementById("cal-next").addEventListener("click", () => {
        if (state.calMonth === 11) { state.calMonth = 0; state.calYear++; }
        else state.calMonth++;
        renderCalendar();
      });

      document.getElementById("btn-open-todo").addEventListener("click", () => {
        openTodoModal(null, todayKey());
      });
      document.getElementById("modal-todo-save").addEventListener("click", saveTodo);
      document.getElementById("modal-todo-delete").addEventListener("click", deleteTodoFromModal);
      document.getElementById("modal-todo-color").addEventListener("input", function () {
        this.dataset.userSet = "1";
      });

      document.getElementById("todo-scroll-inner").addEventListener("click", (e) => {
        const item = e.target.closest(".todo-item");
        if (!item) return;
        const id = item.dataset.id;
        const action = e.target.dataset.action || e.target.closest("[data-action]")?.dataset.action;
        if (action === "del" || e.target.classList.contains("todo-del")) {
          e.stopPropagation();
          deleteTodoById(id);
          return;
        }
        if (action === "toggle" || e.target.type === "checkbox") {
          e.stopPropagation();
          toggleTodo(id);
          return;
        }
        openTodoModal(id);
      });

      document.getElementById("btn-export").addEventListener("click", downloadJson);
      document.getElementById("btn-import-open").addEventListener("click", () => {
        document.getElementById("import-json").value = "";
        openModal("import-modal");
      });
      document.getElementById("btn-import-confirm").addEventListener("click", () => {
        const text = document.getElementById("import-json").value.trim();
        if (!text) { showToast("请粘贴 JSON", "error"); return; }
        if (importJson(text)) closeModal("import-modal");
      });
      document.getElementById("btn-clear-all").addEventListener("click", clearAllData);

      window.addEventListener("resize", () => {
        // 高度变化时重算每栏条数并刷新
        if (msgScroll.timer || state.messages.length) {
          const old = msgScroll.perCol;
          msgScroll.perCol = estimatePerCol();
          if (old !== msgScroll.perCol) paintMsgWindow();
        }
      });
    }

    function init() {
      loadTheme();
      loadState();
      state.selectedDate = todayKey();
      fillEmojiBar("modal-msg-emoji", "modal-msg-content");
      fillEmojiBar("modal-reply-emoji", "modal-reply-content");
      fillEmojiBar("modal-todo-emoji", "modal-todo-title-input");
      updateClock();
      setInterval(updateClock, 1000);
      renderCalendar();
      renderTodos();
      bindEvents();
      // 稍等布局稳定后再算 perCol
      requestAnimationFrame(() => {
        renderMessages();
      });
      loadWeather();
      setInterval(loadWeather, WEATHER_REFRESH_MS);
    }
    init();
  </script>
</body>
</html>
